<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Local Chat (Starter App)</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="chat-container">
    <h1>Local Chat <span class="badge">starter app</span></h1>

    <div id="chat-log" class="chat-log"> <!--Opens a container div, attribute id= "chat-log"-->
    {% for item in messages %} <!--Jinja Loop, messages is passed from index() in app.py, item is one dict since conversations (messages) is a list of dicts-->
    <div class="msg {{item.role}}">{{item.content}}</div> <!--retrieves the role and content from each item (dict) in messages. "msg item.role" helps the chat history distinguish the sender of the message-->
      {% endfor %} <!--Ends block-->
</div>
                                          

    <form id="chat-form">
      <input
        id="message-input"
        type="text"
        placeholder="Type a message..."
        autocomplete="off"
        required
      >
      <button type="submit">Send</button>
    </form>
  </main>

  <script src="{{ url_for('static', filename='chat.js') }}"></script>
</body>
</html>
